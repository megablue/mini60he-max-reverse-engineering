name: verify

# The scripts are deterministic and SHA-256 pinned, so a runner either
# reproduces the documented artifacts from bin/ or the repository has drifted.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract the pinned image and re-run the core probes
        run: |
          python analysis/probe_pe.py
          python analysis/decode_fw.py
          python analysis/fw_keys.py
          python analysis/fw_sensor.py
          python analysis/fw_patch.py
          python analysis/isp_gate.py
          python analysis/fw_code.py
          python analysis/probe_radio.py
          python analysis/probe_cert.py

      - name: Confirm the extracted image matches the pin
        run: |
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path("analysis/out/rcdata_4000.bin")
          got = hashlib.sha256(p.read_bytes()).hexdigest().upper()
          want = "06A1A47432A6CA7EC060103378E2D984A46F9AFA98F19FCCD99219EAEA4A88E0"
          print("image", got)
          assert got == want, "firmware image does not match the pin"
          PY

      - name: Rebuild the flashed bake with the one-command builder
        run: |
          python analysis/fw_build.py "RAlt=Fn" "Fn=Right" "RShift=Up" "Menu=Left" \
            "RCtrl=Down" "Fn+Right=VolUp" --fn-row 32 --name ci_bake
          python - <<'PY'
          import hashlib, pathlib
          for name, want in (("ci_bake.bin", "617eef7f4bb4cd5ceecaaee5d4d54124836f9ba63691b17185e094c3c744cd16"),
                             ("ci_bake.exe", "774bb728326c42e00f42f0da4fd7be8edacd2859037d09bfdc659d90fc5fe9a9")):
              got = hashlib.sha256(pathlib.Path("analysis/out", name).read_bytes()).hexdigest()
              print(name, got)
              assert got == want, f"{name} does not reproduce the flashed bake"
          PY

      - name: Rebuild the wireless dead window and pin both images
        run: |
          python analysis/fw_deadwin.py --no-exe --name ci_deadwin
          python analysis/fw_deadwin.py --base analysis/out/ci_bake.bin --no-exe --name ci_deadwin_remap
          python - <<'PY'
          import hashlib, pathlib
          for name, want in (
                  ("ci_deadwin.bin", "2a26756ae32525e10c0a92b950728ab8d983c0bae856b0e34ff7f3ddcd745d08"),
                  ("ci_deadwin_remap.bin", "4dd3201cae72e7d4974731d9c300797255236399ea014479467a4261e0f3d4bb")):
              got = hashlib.sha256(pathlib.Path("analysis/out", name).read_bytes()).hexdigest()
              print(name, got)
              assert got == want, f"{name} does not reproduce the dead-window build"
          img = pathlib.Path("analysis/out/ci_deadwin.bin").read_bytes()
          assert img[0x127E0:0x127E4] == bytes.fromhex("0df00ebc"), "hook changed"
          assert img[0x20000:0x20004] == bytes.fromhex("2de9f05f"), "stub changed"
          assert len(img) == 0x7E000 and img[-4:] == bytes.fromhex("5555aaaa")
          PY

      - name: Rebuild the dead-window marker and pin it
        run: |
          python analysis/fw_deadwin_probe.py --base analysis/out/ci_bake.bin --no-exe --name ci_deadwin_probe
          python - <<'PY'
          import hashlib, pathlib
          want = "21223c426d4065bf29db21b43cb3859390cf33c79c16c7a6a0d324ca49c56433"
          got = hashlib.sha256(pathlib.Path("analysis/out/ci_deadwin_probe.bin").read_bytes()).hexdigest()
          print("ci_deadwin_probe.bin", got)
          assert got == want, "the marker build does not reproduce"
          img = pathlib.Path("analysis/out/ci_deadwin_probe.bin").read_bytes()
          assert img[0x127E0:0x127E4] == bytes.fromhex("0df00ebc"), "hook changed"
          # a/q/w table, then the four literal words the stub loads
          assert img[0x20044:0x20048] == bytes.fromhex("04141a00"), "letter table changed"
          assert img[0x20048:0x20058] == bytes.fromhex("8c00002078030020a804002010060020"), "literals changed"
          assert len(img) == 0x7E000 and img[-4:] == bytes.fromhex("5555aaaa")
          PY

      - name: Rebuild the boot-window build and pin it
        run: |
          python analysis/fw_bootwin.py --base analysis/out/ci_bake.bin --no-exe --name ci_bootwin
          python - <<'PY'
          import hashlib, pathlib
          want = "9c4aa001be8f77ca8ce6e6648ef61513afd2d98cfb0074c472cdaff2d11feee7"
          got = hashlib.sha256(pathlib.Path("analysis/out/ci_bootwin.bin").read_bytes()).hexdigest()
          print("ci_bootwin.bin", got)
          assert got == want, "the boot-window build does not reproduce"
          img = pathlib.Path("analysis/out/ci_bootwin.bin").read_bytes()
          assert img[0x127E0:0x127E4] == bytes.fromhex("0df00ebc"), "hook changed"
          assert img[0x20000:0x20020] == bytes.fromhex(
              "2de9f05f06480078002811d005490a68002a0dd040f6c41c624509d8bde8f09f"), "stub code changed"
          assert img[0x20020:0x20028] == bytes.fromhex("78030020a8040020"), "literals changed"
          assert img[0x20028:0x20030] == bytes.fromhex("00bf00bf00bf00bf"), "pad changed"
          assert img[0x20030:0x20034] == bytes.fromhex("f2f7d8bb"), "pass branch changed"
          assert len(img) == 0x7E000 and img[-4:] == bytes.fromhex("5555aaaa")
          PY

      - name: Rebuild the macro guard and pin it
        run: |
          python analysis/fw_macroguard.py --base analysis/out/ci_bake.bin --no-exe --name ci_macroguard
          python - <<'PY'
          import hashlib, pathlib
          want = "795611fdab3e111dc9f50463de38d1b9eda8bb6e84527b95a012fc86b1ac5cb6"
          got = hashlib.sha256(pathlib.Path("analysis/out/ci_macroguard.bin").read_bytes()).hexdigest()
          print("ci_macroguard.bin", got)
          assert got == want, "the macro guard does not reproduce"
          img = pathlib.Path("analysis/out/ci_macroguard.bin").read_bytes()
          assert img[0x127E0:0x127E4] == bytes.fromhex("0df00ebc"), "hook changed"
          assert img[0x20000:0x2002C] == bytes.fromhex(
              "2de9f05f0a48007868b108480078392809d108480078012805d1"
              "07480078002801d1bde8f08ff2f7ddbb00bf"), "stub code changed"
          assert img[0x2002C:0x2003C] == bytes.fromhex(
              "8c0000207803002090000020b3000020"), "literals changed"
          assert len(img) == 0x7E000 and img[-4:] == bytes.fromhex("5555aaaa")
          PY

      - name: Rebuild the fallback removal and pin it
        run: |
          python analysis/fw_fallback.py --base analysis/out/ci_bake.bin --no-exe --name ci_fallback
          python - <<'PY'
          import hashlib, pathlib
          want = "5031e302e085aff6c4d0b4290d520da32230ab98446d1fdb2f31005386403060"
          got = hashlib.sha256(pathlib.Path("analysis/out/ci_fallback.bin").read_bytes()).hexdigest()
          print("ci_fallback.bin", got)
          assert got == want, "the fallback removal does not reproduce"
          img = pathlib.Path("analysis/out/ci_fallback.bin").read_bytes()
          assert img[0x16B50] == 0x00, "position 18 still stages a factory usage"
          assert img[0x5D54:0x5D5A] == bytes.fromhex("00bf00bf00bf"), "bail not removed"
          assert img[0x5E80:0x5E84] == bytes.fromhex("00f010b8"), "empty branch not redirected"
          assert len(img) == 0x7E000 and img[-4:] == bytes.fromhex("5555aaaa")
          PY

      - name: Rebuild the release build and pin it
        run: |
          python analysis/fw_fallback.py --base analysis/out/ci_bake.bin --fn-row Left=VolDown --no-exe --name ci_release
          python - <<'PY'
          import hashlib, pathlib
          want = "ecb236fb447298891582426603b880288e3994119cdabf0b20dded8a465db517"
          got = hashlib.sha256(pathlib.Path("analysis/out/ci_release.bin").read_bytes()).hexdigest()
          print("ci_release.bin", got)
          assert got == want, "the release build does not reproduce"
          img = pathlib.Path("analysis/out/ci_release.bin").read_bytes()
          assert img[0x16C40:0x16C42] == bytes.fromhex("50ba"), "Fn row 1 is not Fn+Left=VolDown"
          assert img[0x16C7E:0x16C80] == bytes.fromhex("4fb9"), "Fn+Right was disturbed"
          assert img[0x16B50] == 0x00, "position 18 still stages a factory usage"
          assert img[0x5D54:0x5D5A] == bytes.fromhex("00bf00bf00bf"), "bail not removed"
          assert img[0x5E80:0x5E84] == bytes.fromhex("00f010b8"), "empty branch not redirected"
          assert img[0x127E0:0x127E4] == bytes.fromhex("2de9f05f"), "an inherited hook is present"
          assert img[0x20000:0x20004] == bytes.fromhex("00000000"), "stub band is not blank"
          assert len(img) == 0x7E000 and img[-4:] == bytes.fromhex("5555aaaa")
          PY
