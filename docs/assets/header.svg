<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" role="img" aria-label="Mini60HE Max firmware reverse engineering - the four bytes that move a keystroke">
  <defs>
    <radialGradient id="bg" cx="18%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#132a3a"/>
      <stop offset="52%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0c1422"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630"/>
  </g>

  <!-- eyebrow chip -->
  <g transform="translate(80, 116)">
    <rect x="0" y="0" width="304" height="34" rx="17" fill="#101a2b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="152" y="22" fill="#7dd3fc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">STATIC REVERSE ENGINEERING</text>
  </g>

  <!-- title -->
  <text x="80" y="206" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">Mini60HE Max</text>

  <!-- accent underline -->
  <rect x="82" y="228" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- subtitle -->
  <text x="80" y="290" fill="#a8b3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">Every keypress, traced to a byte.</text>
  <text x="80" y="326" fill="#8b96ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">The vendor updater, the firmware image inside it, and the</text>
  <text x="80" y="352" fill="#8b96ab" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">four bytes that decide what a keystroke becomes.</text>

  <!-- feature tags -->
  <g transform="translate(80, 408)" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13">
    <g>
      <rect x="0" y="0" width="126" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="63" y="20" fill="#cbd5e1" text-anchor="middle">PE census</text>
    </g>
    <g transform="translate(138,0)">
      <rect x="0" y="0" width="158" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="79" y="20" fill="#cbd5e1" text-anchor="middle">AA 55 protocol</text>
    </g>
    <g transform="translate(308,0)">
      <rect x="0" y="0" width="126" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="63" y="20" fill="#cbd5e1" text-anchor="middle">Thumb map</text>
    </g>
    <g transform="translate(446,0)">
      <rect x="0" y="0" width="150" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="75" y="20" fill="#cbd5e1" text-anchor="middle">key pipeline</text>
    </g>
  </g>

  <!-- right motif: the pipeline that matters -->
  <g transform="translate(790, 150)" filter="url(#glow)">
    <rect x="0" y="0" width="320" height="72" rx="14" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="24" y="31" fill="#7dd3fc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600">0x9600 + id*4</text>
    <text x="24" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">key catalog - the real output path</text>
  </g>
  <g transform="translate(790, 250)" filter="url(#glow)">
    <rect x="0" y="0" width="320" height="72" rx="14" fill="url(#card)" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="24" y="31" fill="#a5b4fc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600">0x16C3E + mode*0x68</text>
    <text x="24" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Fn overlays - 51 rows, per OS</text>
  </g>
  <g transform="translate(790, 350)" filter="url(#glow)">
    <rect x="0" y="0" width="320" height="72" rx="14" fill="url(#card)" stroke="#c084fc" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="24" y="31" fill="#d8b4fe" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600">4C 49 &#8594; 4F B9</text>
    <text x="24" y="55" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Fn + Right Arrow = Volume Up</text>
  </g>
</svg>
